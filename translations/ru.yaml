configuration:
  enable_media_ducking:
    name: "Приглушение музыки (Ducking)"
    description: "Автоматически понижать громкость колонки во время диалога с ассистентом."
  ducking_volume_factor:
    name: "Коэффициент приглушения"
    description: "Коэффициент громкости при дакинге (например 0.25 = 25% от текущей громкости)."
  default_media_player:
    name: "Медиаплеер для приглушения"
    description: "Entity ID медиаплеера Home Assistant, громкость которого приглушается."
  ma_api_key:
    name: "API-ключ Music Assistant"
    description: "Опциональный токен для Music Assistant."
  regenerate_phrases:
    name: "Перегенерировать фразы"
    description: "Принудительно заставить Порфирия придумать и озвучить новый комплект системных фраз при перезапуске."
  debug_mode:
    name: "Режим отладки"
    description: "Включить подробные логи сервера."
  debug_audio:
    name: "Отладка аудио"
    description: "Логирование передачи аудиопакетов."
  mqtt_host:
    name: "MQTT Хост"
    description: "IP адрес или имя хоста MQTT брокера (оставьте пустым для автоопределения Mosquitto)."
  mqtt_port:
    name: "MQTT Порт"
    description: "Порт MQTT брокера (по умолчанию 1883)."
  mqtt_username:
    name: "MQTT Логин"
    description: "Имя пользователя для авторизации в MQTT (оставьте пустым если не требуется)."
  mqtt_password:
    name: "MQTT Пароль"
    description: "Пароль для авторизации в MQTT."
