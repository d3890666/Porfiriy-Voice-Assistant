configuration:
  enable_media_ducking:
    name: "Enable Media Ducking"
    description: "Temporarily lower Home Assistant media player volume during voice interaction."
  ducking_volume_factor:
    name: "Ducking Volume Factor"
    description: "Fraction to reduce volume during ducking (e.g. 0.25 = 25% of current volume)."
  default_media_player:
    name: "Default Media Player"
    description: "Entity ID of the media player to duck during speech."
  ma_api_key:
    name: "Music Assistant API Key"
    description: "Optional API token for Music Assistant integration."
  regenerate_phrases:
    name: "Regenerate Dynamic Phrases"
    description: "Force Porfiriy to brainstorm and synthesize a new set of system phrases on startup."
  debug_mode:
    name: "Debug Mode"
    description: "Enable verbose debug logging."
  debug_audio:
    name: "Debug Audio"
    description: "Log detailed audio packet metrics."
  mqtt_host:
    name: "MQTT Host"
    description: "IP address or hostname of the MQTT broker (leave blank to auto-discover Mosquitto)."
  mqtt_port:
    name: "MQTT Port"
    description: "Port of the MQTT broker (default 1883)."
  mqtt_username:
    name: "MQTT Username"
    description: "Username for MQTT authentication (optional)."
  mqtt_password:
    name: "MQTT Password"
    description: "Password for MQTT authentication."
