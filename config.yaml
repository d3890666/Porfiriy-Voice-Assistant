name: "Porfiriy Voice Assistant"
description: "Voice Assistant proxy bridge for Gemini Live API and Home Assistant Assist Pipeline"
version: "0.0.28"
slug: "porfiriy_voice_assistant"
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
map:
  - share:rw
  - config:rw
options:
  gemini_api_key: ""
  gemini_model: "gemini-2.0-flash-exp"
  system_prompt: "Ты умный голосовой помощник Порфирий, интегрированный в Умный Дом. Если тебя просят выполнить команду по умному дому, используй доступные функции."
  voice_name: "Charon"
  debug_mode: true
  debug_audio: false
  enable_google_search: true
  vad_silence_duration_ms: 800
  enable_barge_in: false
  default_media_player: "media_player.iandeks_stantsiia_2_a9yk"
  ma_api_key: ""
schema:
  gemini_api_key: str
  gemini_model: str
  system_prompt: str
  voice_name: "list(Puck|Charon|Kore|Fenrir|Aoede|Zephyr)"
  debug_mode: bool
  debug_audio: bool
  enable_google_search: bool
  vad_silence_duration_ms: int
  enable_barge_in: bool
  default_media_player: str
  ma_api_key: str
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: "WebSocket Audio Server"
