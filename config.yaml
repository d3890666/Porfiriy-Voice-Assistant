name: "Porfiriy Voice Assistant"
description: "Voice Assistant proxy bridge for Gemini Live API and Home Assistant Assist Pipeline"
version: "0.0.97"

slug: "porfiriy_voice_assistant"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:microphone-message"
panel_title: "Порфирий"
services:
  - "mqtt:want"
map:
  - share:rw
  - config:rw
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  debug_mode: true
  debug_audio: false
schema:
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "str?"
  debug_mode: bool
  debug_audio: bool
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: "WebSocket Audio Server"
